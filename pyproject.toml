[project]
name = "hole-cam"
version = "0.1.0"
description = "STEP part in, checked drilling G-code out."
authors = [
    { name = "Ryan Rhodes", email = "ryan@ryanrhodes.io" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=2.6.0",
    "cadquery>=2.8.0",
    # Last releases with Intel Mac wheels; newer ones only ship arm64 builds for macOS.
    "casadi<=3.7.2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "fastapi>=0.162.2",
    "llvmlite<=0.45.1; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "nlopt==2.9.1; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "numba<=0.62.1; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "python-multipart>=0.0.33",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
# SWIG bindings in OCP (CadQuery) emit these on import; not ours to fix.
filterwarnings = ["ignore:builtin type .* has no __module__ attribute:DeprecationWarning"]
